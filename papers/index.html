<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Paper Feed - Ganyuan Cao</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .controls {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            align-items: center;
            font-size: 0.95em;
        }

        .controls input[type="search"] {
            flex: 1 1 220px;
            min-width: 0;
        }

        .controls input[type="search"],
        .controls select {
            padding: 6px 8px;
            font: inherit;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        #status {
            color: var(--muted);
            font-size: 0.9em;
        }

        .paper {
            display: flex;
            gap: 12px;
            margin: 1.1em 0;
        }

        .paper.low {
            opacity: 0.65;
        }

        .score {
            flex: none;
            width: 2.2em;
            height: 1.7em;
            line-height: 1.7em;
            text-align: center;
            font-weight: bold;
            color: var(--bg);
            background: var(--accent);
            border-radius: 4px;
        }

        .low .score {
            background: var(--muted);
        }

        .paper .body {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .paper p {
            margin: 2px 0;
        }

        .paper .title {
            font-weight: 600;
        }

        .paper .title a {
            text-decoration: none;
        }

        .paper .title a:hover {
            text-decoration: underline;
        }

        .new .title::after {
            content: "new";
            margin-left: 6px;
            padding: 0 5px;
            font-size: 0.75em;
            color: var(--bg);
            background: var(--badge);
            border-radius: 3px;
        }

        .meta {
            color: var(--muted);
            font-size: 0.9em;
        }

        .hit {
            display: inline-block;
            margin: 2px 4px 0 0;
            padding: 0 6px;
            font-size: 0.85em;
            color: var(--text);
            background: var(--chip);
            border-radius: 3px;
        }

        .hit.neg {
            background: var(--chip-neg);
        }

        details summary {
            cursor: pointer;
            color: var(--accent);
            font-size: 0.9em;
            padding: 2px 0;
        }

        details p {
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <div class="nav">
        <a href="../">Home</a>
    </div>

    <h1>Paper Feed</h1>
    <p id="status">Loading…</p>

    <div class="controls">
        <input type="search" id="q" placeholder="Search title, authors, abstract">
        <label>Source
            <select id="source">
                <option value="">all</option>
                <option>arXiv</option>
                <option>ePrint</option>
            </select>
        </label>
        <label>Order
            <select id="order">
                <option value="day">by day, then score</option>
                <option value="score">by score</option>
            </select>
        </label>
        <label><input type="checkbox" id="all"> show all</label>
    </div>

    <div id="list"></div>

    <script>
        // papers.json is written by triage.py; the workflow publishes it on the
        // paper-data branch so the daily update never touches main.
        const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
        const DATA_URL = LOCAL ? "papers.json" :
            "https://raw.githubusercontent.com/ganyuancao/ganyuancao.github.io/paper-data/papers.json";
        const SEEN_KEY = "papers.lastVisit";

        const $ = id => document.getElementById(id);
        let data = null;
        let lastVisit = "";

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text != null) e.textContent = text;
            return e;
        }

        function renderPaper(p) {
            const low = p.score < data.threshold;
            const row = el("div", "paper" + (low ? " low" : "") +
                (lastVisit && p.seen > lastVisit ? " new" : ""));
            row.append(el("div", "score", p.score));

            const body = el("div", "body");
            const title = el("p", "title");
            const a = el("a", null, p.title);
            if (/^https:\/\//.test(p.link)) a.href = p.link;
            a.target = "_blank";
            a.rel = "noopener";
            title.append(a);
            body.append(title);
            body.append(el("p", null, p.authors));

            const src = p.category ? `${p.source} · ${p.category}` : p.source;
            const meta = el("p", "meta", `${src} · submitted ${p.date.slice(0, 10)} `);
            for (const [word, weight] of p.hits)
                meta.append(el("span", "hit" + (weight < 0 ? " neg" : ""),
                    `${word} ${weight > 0 ? "+" : ""}${weight}`));
            body.append(meta);

            const det = el("details");
            det.append(el("summary", null, "abstract"), el("p", null, p.abstract));
            body.append(det);

            row.append(body);
            return row;
        }

        function render() {
            const q = $("q").value.trim().toLowerCase();
            const source = $("source").value;
            const all = $("all").checked;
            const shown = data.papers.filter(p =>
                (all || p.score >= data.threshold) &&
                (!source || p.source === source) &&
                (!q || `${p.title} ${p.authors} ${p.abstract}`.toLowerCase().includes(q)));

            const list = $("list");
            list.replaceChildren();
            if ($("order").value === "score") {
                shown.sort((a, b) => b.score - a.score || (a.seen < b.seen ? 1 : -1));
                list.append(...shown.map(renderPaper));
            } else {
                // papers.json is already sorted by the day a paper was first
                // seen (UTC), then score.
                let day = "";
                for (const p of shown) {
                    if (p.seen.slice(0, 10) !== day) {
                        day = p.seen.slice(0, 10);
                        list.append(el("h2", null, "Received " + new Date(day).toLocaleDateString(
                            "en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" })));
                    }
                    list.append(renderPaper(p));
                }
            }
            if (!shown.length) list.append(el("p", null, "No papers match."));

            const updated = new Date(data.updated).toLocaleString("en-GB",
                { dateStyle: "medium", timeStyle: "short", timeZone: "UTC" }) + " UTC";
            $("status").textContent =
                `${shown.length} of ${data.papers.length} papers shown · ` +
                `threshold ${data.threshold} · updated ${updated}` +
                (data.failed.length ? ` · ${data.failed.join(", ")} failed on the last run` : "");
        }

        async function load() {
            try {
                const r = await fetch(DATA_URL, { cache: "no-cache" });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                data = await r.json();
            } catch (ex) {
                $("status").textContent = `Could not load the paper list (${ex.message}).`;
                return;
            }
            try {
                lastVisit = localStorage.getItem(SEEN_KEY) || "";
                localStorage.setItem(SEEN_KEY, data.updated);
            } catch (ex) { /* private mode: no "new" badges */ }
            for (const id of ["q", "source", "order", "all"])
                $(id).addEventListener("input", render);
            render();
        }

        load();
    </script>
</body>

</html>
